[tool.poetry]
name = "osawards-datacollector-dck"
version = "0.1.0"
description = "Component to collect the data and build the dashboards for the Visualization Tool"
authors = ["alberto.molinuevo@tecnalia.com"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
elasticsearch = "8.17.2"
pandas = "2.2.3"
paramiko = "3.5.0"
requests = "2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"